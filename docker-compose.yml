services:
  INOOVAZAP-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${INOOVAZAP_PORT:-8080}:8080"
    environment:
      - INOOVAZAP_ADMIN_TOKEN=${INOOVAZAP_ADMIN_TOKEN}
      - INOOVAZAP_GLOBAL_ENCRYPTION_KEY=${INOOVAZAP_GLOBAL_ENCRYPTION_KEY}
      - INOOVAZAP_GLOBAL_HMAC_KEY=${INOOVAZAP_GLOBAL_HMAC_KEY:-}
      - INOOVAZAP_GLOBAL_WEBHOOK=${INOOVAZAP_GLOBAL_WEBHOOK:-}
      - DB_USER=${DB_USER:-INOOVAZAP}
      - DB_PASSWORD=${DB_PASSWORD:-INOOVAZAP}
      - DB_NAME=${DB_NAME:-INOOVAZAP}
      - DB_HOST=db
      - DB_PORT=${DB_PORT:-5432}
      - TZ=${TZ:-America/Sao_Paulo}
      - WEBHOOK_FORMAT=${WEBHOOK_FORMAT:-json}
      - SESSION_DEVICE_NAME=${SESSION_DEVICE_NAME:-INOOVAZAP}
      # RabbitMQ configuration Optional
      - RABBITMQ_URL=amqp://INOOVAZAP:INOOVAZAP@rabbitmq:5672/
      - RABBITMQ_QUEUE=whatsapp_events
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - INOOVAZAP-network
    restart: on-failure

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER:-INOOVAZAP}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-INOOVAZAP}
      POSTGRES_DB: ${DB_NAME:-INOOVAZAP}
    # ports:
    #   - "${DB_PORT:-5432}:5432" # Uncomment to access the database directly from your host machine.
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - INOOVAZAP-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-INOOVAZAP}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  rabbitmq:
    image: rabbitmq:3-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: INOOVAZAP
      RABBITMQ_DEFAULT_PASS: INOOVAZAP
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672" # AMQP port
      - "15672:15672" # Management UI port
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - INOOVAZAP-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

networks:
  INOOVAZAP-network:
    driver: bridge

volumes:
  db_data:
  rabbitmq_data:
